[package]
name = "promptfun-market-sbf-tests"
version = "0.1.0"
edition = "2021"

# Separate SDK resolution from Anchor 1.2.1; tests exercise its compiled SBF binary.
[workspace]

[dependencies]
litesvm = "=0.13.1"
solana-account = "=3.4.0"
solana-address = { version = "=2.6.0", features = ["curve25519"] }
solana-clock = "=3.0.1"
solana-instruction = "=3.2.0"
solana-keypair = "=3.1.0"
solana-message = "=3.1.0"
solana-signer = "=3.0.0"
solana-transaction = "=3.1.0"
solana-loader-v3-interface = { version = "=6.1.0", features = ["bincode"] }
bincode = "1.3"
sha2 = "0.10"
serde_json = "1.0"

[lib]
path = "src/lib.rs"
